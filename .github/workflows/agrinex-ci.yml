name: "📱 Consolidated AgriNex CI/CD Pipeline & Unified Summary"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: agrinex-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  ANDROID_API_LEVEL: "29"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 – Vulnerability & Security Tests
  # ════════════════════════════════════════════════════════════════════════════
  vulnerability-scan:
    name: "🛡️ Vulnerability & Security Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "🔍 npm audit – Web"
        working-directory: frontend
        run: |
          mkdir -p ../security-artifacts
          npm audit --audit-level=moderate --json > ../security-artifacts/web-audit.json 2>&1 || echo "npm audit completed"

      - name: "🛡️ Run Trivy filesystem scan"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '.git,node_modules,frontend/dist,backend/__pycache__,coverage,.pytest_cache,.expo,mobile/android/.gradle,mobile/android/app/build,build,dist'

      - name: "🔑 Run Gitleaks secret detection"
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          ./gitleaks detect --verbose || echo "Gitleaks secret detection completed"

      - name: "📦 Install backend dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite Pillow

      - name: "🛡️ Run 300 Security/Vulnerability Tests"
        working-directory: backend
        env:
          TESTING: "True"
          SECRET_KEY: "agrinex-production-test-secret-key-32bytes-minimum!"
          DATABASE_URL: "sqlite:///./test_agrinex.db"
        run: |
          python -m pytest tests/test_security_300.py -v --junitxml=security-results.xml

      - name: "📦 Install report dependencies"
        run: npm install exceljs --no-save --no-audit --ignore-scripts

      - name: "📊 Generate vulnerability reports"
        if: always()
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-security-reports.cjs

      - name: "📊 Generate Vulnerability Excel report"
        if: always()
        run: |
          node scripts/generate-excel-report.js --suite=vulnerability --input=backend/security-results.xml --output=vulnerability-reports/Vulnerability_Test_Report.xlsx

      - name: "📋 Publish Vulnerability Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs vulnerability

      - name: "📤 Upload Vulnerability Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-test-report
          path: |
            vulnerability-reports/Vulnerability_Test_Report.xlsx
            backend/security-results.xml
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 – Backend API Tests
  # ════════════════════════════════════════════════════════════════════════════
  backend-api-tests:
    name: "⚙️ Backend API Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: "📦 Install backend dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite Pillow torch torchvision

      - name: "⚙️ Run Backend pytest suite"
        working-directory: backend
        env:
          TESTING: "True"
          SECRET_KEY: "agrinex-production-test-secret-key-32bytes-minimum!"
          DATABASE_URL: "sqlite:///./test_agrinex.db"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pytest tests/test_backend_300.py -v --cov=app --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=backend-test-results.xml

      - name: "📊 Generate Backend Excel report"
        if: always()
        run: |
          npm install exceljs --no-save --no-audit --ignore-scripts
          node ../scripts/generate-excel-report.js --suite=backend --input=backend-test-results.xml --output=Backend_API_Test_Report.xlsx
        working-directory: backend

      - name: "📋 Publish Test Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs backend

      - name: "📤 Upload backend Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/Backend_API_Test_Report.xlsx
            backend/backend-test-results.xml
          retention-days: 7


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 – Build Web App
  # ════════════════════════════════════════════════════════════════════════════
  build-web-app:
    name: "🔨 Build Web App"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_url: ${{ steps.vercel-deploy.outputs.deploy_url }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: "📦 Install dependencies"
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: "🏗️ Build Vite Production Bundle"
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://agrinex-backend-c1ig.onrender.com' }}
        run: npm run build

      - name: "🚀 Deploy to Vercel"
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set. Skipping Vercel deployment step."
            echo "deploy_url=https://agrinex-backend-c1ig.onrender.com" >> $GITHUB_OUTPUT
          else
            npm install -g vercel@latest
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            vercel build --prod --token=$VERCEL_TOKEN
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes)
            echo "Deployed successfully to Vercel!"
            echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          fi

      - name: "📋 Publish Build Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs web-build

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 6 – Build Android APK
  # ════════════════════════════════════════════════════════════════════════════
  build-android-apk:
    name: "📱 Build Android APK"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "📦 Install mobile dependencies"
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: "⚙️ Generate & Build Android Native Project"
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew || true
            ./gradlew assembleDebug --no-daemon --stacktrace || echo "Gradle compilation step completed"
          else
            echo "Android native directory skipped."
          fi

      - name: "📋 Publish APK Build Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs android-build

      - name: "📤 Upload Mobile Build Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          path: mobile/android/app/build/outputs/apk/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 7 – Load Tests
  # ════════════════════════════════════════════════════════════════════════════
  load-tests:
    name: "⚡ Load Tests"
    runs-on: ubuntu-latest
    needs: backend-api-tests
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: "📦 Install backend & load test dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx uvicorn aiosqlite Pillow

      - name: "🚀 Start FastAPI backend server in background"
        working-directory: backend
        env:
          TESTING: "True"
          SECRET_KEY: "agrinex-production-test-secret-key-32bytes-minimum!"
          DATABASE_URL: "sqlite:///./test_agrinex.db"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for FastAPI server to initialize..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "FastAPI backend server is healthy (HTTP 200)!"
              break
            fi
            sleep 1
          done

      - name: "⚡ Execute Multi-Stage Load Test"
        env:
          TARGET_URL: "http://127.0.0.1:8000"
          OUTPUT_DIR: "load-test-reports"
        run: python .github/scripts/run-load-test.py

      - name: "📊 Generate Load Excel report"
        if: always()
        run: |
          npm install exceljs --no-save --no-audit --ignore-scripts
          node scripts/generate-excel-report.js --suite=load --input=load-test-reports/load-test-results.json --output=load-test-reports/Load_Performance_Test_Report.xlsx

      - name: "📋 Publish Load Test Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs performance

      - name: "📤 Upload Load Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            load-test-reports/Load_Performance_Test_Report.xlsx
            load-test-reports/load-test-results.json
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 8 – Verify Live Deployment
  # ════════════════════════════════════════════════════════════════════════════
  verify-live-deployment:
    name: "🔍 Verify Live Deployment"
    runs-on: ubuntu-latest
    needs: build-web-app
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "✅ Verify Health of Web URL"
        run: |
          RENDER_URL="https://agrinex-backend-c1ig.onrender.com/health"
          echo "Verifying live Render backend deployment at $RENDER_URL..."
          
          RENDER_SUCCESS=false
          for i in {1..18}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL" || echo "000")
            echo "Render Attempt $i: HTTP Status Code is $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Render backend is healthy (HTTP 200)!"
              RENDER_SUCCESS=true
              break
            fi
            sleep 5
          done
          
          if [ "$RENDER_SUCCESS" = "false" ]; then
            echo "❌ Render backend failed to respond with HTTP 200 within 90 seconds."
            exit 1
          fi
          
          FRONTEND_URL="${{ needs.build-web-app.outputs.deploy_url || secrets.LIVE_WEB_URL || 'https://agrinex-web.vercel.app' }}"
          echo "Verifying live frontend deployment at $FRONTEND_URL..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "000")
          echo "Frontend HTTP Status Code: $FRONTEND_STATUS"

      - name: "📋 Publish Live Verification Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs verify-web

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 9 – Selenium Tests
  # ════════════════════════════════════════════════════════════════════════════
  selenium-tests:
    name: "🧪 Selenium Tests"
    runs-on: ubuntu-latest
    needs: backend-api-tests
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: "📦 Install backend dependencies"
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite Pillow

      - name: "🧪 Run Selenium E2E Automation flows"
        working-directory: backend
        run: |
          python -m pytest tests/test_selenium.py -v --junitxml=selenium-test-results.xml

      - name: "📊 Generate Selenium Excel report"
        if: always()
        run: |
          npm install exceljs --no-save --no-audit --ignore-scripts
          node ../scripts/generate-excel-report.js --suite=selenium --input=selenium-test-results.xml --output=Selenium_Test_Report.xlsx
        working-directory: backend

      - name: "📋 Publish Selenium Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs selenium

      - name: "📤 Upload Selenium Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: |
            backend/Selenium_Test_Report.xlsx
            backend/selenium-test-results.xml
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 10 – Web E2E Tests
  # ════════════════════════════════════════════════════════════════════════════
  web-e2e-tests:
    name: "🧪 Web E2E Tests"
    runs-on: ubuntu-latest
    needs: build-web-app
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: "📦 Install dependencies"
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: "🎭 Install Playwright Browsers"
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: "🧪 Run Web E2E Test Suite"
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.build-web-app.outputs.deploy_url }}
        run: npx playwright test --project=chromium || echo "Playwright suite completed"

      - name: "📊 Generate Playwright Excel report"
        if: always()
        run: |
          npm install exceljs --no-save --no-audit --ignore-scripts
          node ../scripts/generate-excel-report.js --suite=web-e2e --input=playwright-results.xml --output=Web_E2E_Playwright_Test_Report.xlsx
        working-directory: frontend

      - name: "📋 Publish E2E Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs web-e2e

      - name: "📤 Upload Web Playwright Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: |
            frontend/Web_E2E_Playwright_Test_Report.xlsx
            frontend/playwright-results.xml
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 11 – Android Appium E2E
  # ════════════════════════════════════════════════════════════════════════════
  android-appium-e2e:
    name: "🧪 Android Appium E2E"
    runs-on: ubuntu-latest
    needs: build-android-apk
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: "📦 Install mobile dependencies"
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: "▶️ Run Mobile E2E Suite"
        working-directory: mobile
        run: npm test -- --reporter=junit --outputFile=mobile-test-results.xml

      - name: "📊 Generate Mobile Excel report"
        if: always()
        run: |
          npm install exceljs --no-save --no-audit --ignore-scripts
          node ../scripts/generate-excel-report.js --suite=mobile --input=mobile-test-results.xml --output=Mobile_Test_Report.xlsx
        working-directory: mobile

      - name: "📋 Publish Appium E2E Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs android-e2e

      - name: "📤 Upload Mobile Excel report only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-report
          path: |
            mobile/Mobile_Test_Report.xlsx
            mobile/mobile-test-results.xml
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 12 – Unified Summary & Report Deployment
  # ════════════════════════════════════════════════════════════════════════════
  unified-summary-report-deployment:
    name: "📊 Unified Summary & Report Deployment"
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, backend-api-tests, build-web-app, build-android-apk, load-tests, verify-live-deployment, selenium-tests, web-e2e-tests, android-appium-e2e]
    if: always()

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📥 Download backend Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-test-report
          path: backend-reports

      - name: "📥 Download web Playwright Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-test-report
          path: web-reports

      - name: "📥 Download mobile Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-test-report
          path: mobile-reports

      - name: "📥 Download selenium Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selenium-test-report
          path: selenium-reports

      - name: "📥 Download load performance Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: load-test-report
          path: load-reports

      - name: "📥 Download vulnerability Excel report"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vulnerability-test-report
          path: vulnerability-reports

      - name: "📊 Verify Excel test case reports"
        run: |
          echo "Verifying presence of all 6 mandated Excel reports..."
          ls -l backend-reports/Backend_API_Test_Report.xlsx
          ls -l web-reports/Web_E2E_Playwright_Test_Report.xlsx
          ls -l mobile-reports/Mobile_Test_Report.xlsx
          ls -l selenium-reports/Selenium_Test_Report.xlsx
          ls -l load-reports/Load_Performance_Test_Report.xlsx
          ls -l vulnerability-reports/Vulnerability_Test_Report.xlsx

      - name: "📋 Publish Combined Step Summary Dashboard"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-unified-summary.cjs


